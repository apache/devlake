name: devlake-mysql

services:
  mysql:
    image: mysql:8.4.13
    volumes:
      - mysql-storage:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: lake
      MYSQL_USER: merico
      MYSQL_PASSWORD: merico
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
      --skip-log-bin
      --sql-mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

  grafana:
    image: ${DEVLAKE_IMAGE_REGISTRY:-devlake.docker.scarf.sh}/apache/devlake-dashboard:latest
    build:
      context: grafana/
    ports:
      - ${GRAFANA_HOST_PORT:-3001}:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards/mysql:/etc/grafana/dashboards:ro
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:4001/grafana}"
      GF_USERS_DEFAULT_THEME: "light"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      DATABASE_TYPE: "${GRAFANA_DATABASE_TYPE:-mysql}"
      DATABASE_HOST: "${GRAFANA_DATABASE_HOST:-mysql}"
      DATABASE_PORT: "${GRAFANA_DATABASE_PORT:-3306}"
      DATABASE_NAME: "${GRAFANA_DATABASE_NAME:-lake}"
      DATABASE_USER: "${GRAFANA_DATABASE_USER:-merico}"
      DATABASE_PASSWORD: "${GRAFANA_DATABASE_PASSWORD:-merico}"
      # Legacy vars for older dashboard images; kept in sync with generic vars above.
      MYSQL_URL: "${GRAFANA_DATABASE_HOST:-mysql}:${GRAFANA_DATABASE_PORT:-3306}"
      MYSQL_DATABASE: "${GRAFANA_DATABASE_NAME:-lake}"
      MYSQL_USER: "${GRAFANA_DATABASE_USER:-merico}"
      MYSQL_PASSWORD: "${GRAFANA_DATABASE_PASSWORD:-merico}"
      TZ: UTC
    restart: always
    depends_on:
      - mysql

  devlake:
    image: localhost/devlake-backend:local
    build:
      context: backend
      dockerfile: Containerfile
      args:
        HTTPS_PROXY: "${HTTPS_PROXY}"
        GOPROXY: "${GOPROXY}"
    ports:
      - 8083:8080
    restart: always
    volumes:
      - devlake-log:/app/logs
    env_file:
      - ./.env
    environment:
      DB_URL: mysql://merico:merico@mysql:3306/lake?charset=utf8mb4&parseTime=True&loc=UTC
      E2E_DB_URL: mysql://merico:merico@mysql:3306/lake_test?charset=utf8mb4&parseTime=True&loc=UTC
      REMOTE_PLUGIN_DIR: ""
      FORCE_MIGRATION: "true"
      LOGGING_DIR: /app/logs
      TZ: UTC
    depends_on:
      - mysql

  config-ui:
    image: localhost/devlake-frontend:local
    build:
      context: "config-ui"
      dockerfile: Containerfile
    ports:
      - 4001:4000
    env_file:
      - ./.env
    environment:
      DEVLAKE_ENDPOINT: devlake:8080
      GRAFANA_ENDPOINT: grafana:3000
      TZ: UTC
    depends_on:
      - devlake

  authproxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5-amd64
    network_mode: "host"
    ports:
      - 4181:4180
    env_file:
      - ./.env

volumes:
  mysql-storage:
  grafana-storage:
  devlake-log:
