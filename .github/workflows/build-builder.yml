# Publishes the CI toolchain image from devops/docker/lake-builder.
# Push a tag `builder-vX.Y.Z` to publish `<owner>/devlake:lake-builder-vX.Y.Z`
# (see devops/docker/lake-builder/README.md). It uses the same Docker Hub
# credentials as build.yml. No moving `latest` tag is pushed: workflows pin
# an explicit version.
name: Build-BuilderImage-Push-Docker
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
on:
  push:
    tags:
      - 'builder-v*'
permissions:
  contents: read
jobs:
  build-lake-builder:
    name: Build and push lake-builder image
    if: github.repository == 'apache/devlake'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compute image tag
        id: meta
        run: echo "tag=lake-builder-${GITHUB_REF_NAME#builder-}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and push lake-builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: devops/docker/lake-builder
          push: true
          tags: ${{ secrets.DOCKERHUB_OWNER }}/devlake:${{ steps.meta.outputs.tag }}
          platforms: linux/amd64
