name: unit-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-*]
    paths:
      - '**.go'
      - '**.py'
      - '**.toml'
      - '**.sh'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*.yml'
      - 'test/**'
  schedule:
    - cron: '0 0 * * *' # run ci every night

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    container: mericodev/lake-builder:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set git config
      run: git config --global --add safe.directory $(pwd)
    - name: Install libgit2 1.5 for git2go v34
      run: backend/scripts/install-libgit2.sh
    - name: Install Go 1.26.6
      run: backend/scripts/install-go.sh
    - name: Install mockery 3.7.4
      run: backend/scripts/install-mockery.sh
    - name: Verify committed mocks are up to date
      run: |
        cd backend
        make mock
        git diff --exit-code -- mocks || \
          (echo "::error::backend/mocks is stale — run 'make mock' and commit the result" && exit 1)
    - name: Build Python
      run: |
        cd backend
        echo "Building Python"
        make build-python
    - name: Cache unit-test
      id: cache-unit-test
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ${{ env.GOPATH }}/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Unit tests
      run: |
        go version
        cp env.example .env
        cd backend
        make unit-test
