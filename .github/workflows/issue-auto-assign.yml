# Assigns an issue to its author when the author ticks
# "Yes I am willing to submit a PR!" in the bug report or feature request form.
# Runs on `edited` too, so ticking the box after the issue is opened also works.

name: issue-auto-assign

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.type == 'User' &&
      !contains(github.event.issue.assignees.*.login, github.event.issue.user.login)
    steps:
      - name: Assign the author when they will submit a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # Pass the body through env, never inline it into the script.
          BODY: ${{ github.event.issue.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[x\][[:space:]]*Yes I am willing to submit a PR!'; then
            gh issue edit "$ISSUE_NUMBER" --add-assignee "$AUTHOR"
            echo "Assigned #$ISSUE_NUMBER to @$AUTHOR"
          else
            echo "The PR checkbox is not ticked; nothing to do"
          fi
