# Verifies that every `uses:` ref in .github/workflows is on the ASF
# Infrastructure allow list (apache/infrastructure-actions). GitHub blocks
# actions outside that list at the organisation level, and the resulting job
# dies with "Startup failure": no logs, no annotation, and a PR that looks
# green because no check ever ran.
#
# This check moves that failure to PR time. It also warns (without failing)
# when a pinned action's approved version is about to expire, which is how
# superseded pins are removed from the allow list roughly three months after
# their replacement is approved.
#
# Dependabot covers version bumps; see the github-actions block in
# .github/dependabot.yml for the cooldown that lets ASF review a release
# before a bump is proposed here.

name: asf-allowlist-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  asf-allowlist-check:
    name: ASF action allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `apache/*` is implicitly trusted, but pinning keeps the run reproducible
      # and lets Dependabot track the monorepo's per-action tag prefix.
      - uses: apache/infrastructure-actions/allowlist-check@47b297bbe90f580139129bee531bd84bd95b7f5d # allowlist-check/v1.0.4
        with:
          scan-glob: ".github/workflows/*.yml"
