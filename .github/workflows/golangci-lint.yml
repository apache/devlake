name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    container: mericodev/lake-builder:latest
    steps:
      - uses: actions/checkout@v7
      - name: Set git config
        run: git config --global --add safe.directory $(pwd)
      - name: Install libgit2 1.5 for git2go v34
        run: backend/scripts/install-libgit2.sh
      - name: Install Go 1.27.2
        run: backend/scripts/install-go.sh
      - name: Install mockery 3.8.1
        run: backend/scripts/install-mockery.sh
      - name: Cache golangci-lint
        id: cache-golangci-lint
        uses: actions/cache@v6
        with:
          path: golangci-lint
          key: ${{ runner.os }}-backend-golangci-lint
      - name: generate mock
        run: |
          go version
          cd backend
          make mock
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ./backend
