name: binary-artifact-check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-tracked-binaries:
    name: check for tracked compiled binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject compiled binaries in the source tree
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 file | grep -E 'ELF|Mach-O|PE32|Java archive|compiled Java class|WebAssembly'; then
            echo "::error::Compiled binaries must not be committed to the source tree."
            echo "Remove the files above or store them as release artifacts outside the repository."
            exit 1
          fi
          echo "No compiled binaries found."
