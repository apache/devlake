name: Feature Request
description: Suggest an idea for this project
title: "[Feature][Module Name] Feature title"
labels: ["type/feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        For better communication, Please write in English.

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please make sure to search in the [issues](https://github.com/apache/devlake/issues?q=is%3Aissue) first
        to see whether the same feature was requested already.
      options:
        - label: >
            I had searched in the [issues](https://github.com/apache/devlake/issues?q=is%3Aissue) and found no
            similar feature requirement.
          required: true

  - type: textarea
    attributes:
      label: Use case
      description: Tell us about your contexts and goals.
      placeholder: >
        As a tech lead/product manager/QA engineer/DevOps engineer, I want to ...

  - type: textarea
    attributes:
      label: Description
      description: The description of the feature
      placeholder: >
        Tell us about the detailed description, proposed solutions, wireframes, deliverables or other information of the feature.

  - type: textarea
    attributes:
      label: Related issues
      description: Is there currently another issue associated with this?

  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        This is absolutely not required, but we are happy to guide you in the contribution process
        especially if you already have a good understanding of how to implement the feature.
        Apache DevLake is a totally community-driven project and we love to bring new contributors in.
      options:
        - label: Yes I am willing to submit a PR!

  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: |
        The Code of Conduct helps create a safe space for everyone. We require that everyone agrees to it.
      options:
        - label: |
            I agree to follow this project's [Code of Conduct](https://www.apache.org/foundation/policies/conduct)
          required: true

  - type: markdown
    attributes:
      value: "Thanks for completing our form!"
