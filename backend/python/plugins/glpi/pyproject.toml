[tool.poetry]
name = "glpi"
version = "0.1.0"
description = "DevLake plugin for GLPI"
authors = ["Roger Abelenda <3179183+rabelenda@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pydevlake = { path = "../../pydevlake", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This declarative base already contains:sqlalchemy.exc.SAWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
